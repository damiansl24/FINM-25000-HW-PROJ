# Northstar Crypto configuration.
# Alpaca PAPER keys belong in .env, never in this file.

# Liquid USD pairs supported by Alpaca crypto market data and paper trading.
universe: [BTC/USD, ETH/USD, SOL/USD, LINK/USD, LTC/USD, AVAX/USD]

strategy:
  fast_window: 48              # two-day fast average on completed hourly bars
  slow_window: 168             # seven-day slow average
  momentum_window: 72          # trailing three-day return
  volatility_window: 168       # seven-day annualized volatility estimate
  regime_symbol: BTC/USD       # broad crypto risk-on/risk-off benchmark
  regime_window: 168           # benchmark must also be above its seven-day average
  min_trend_strength: 0.005    # fast average at least 0.5% above slow average
  max_positions: 2             # hold at most two qualifying coins
  target_exposure: 0.50        # keep at least 50% of equity in cash
  max_asset_weight: 0.28       # buffer below the hard 30% position cap
  min_momentum: 0.01           # require at least 1% three-day momentum
  rebalance_interval_min: 1440 # daily cadence; UI can request one immediately

data:
  poll_interval_sec: 20
  feed: us
  signal_timeframe: 1Hour
  live_timeframe: 1Min
  history_days: 30
  db_path: db/crypto_trading.db

risk:
  max_position_pct: 0.30       # post-trade value per coin <= 30% of equity
  max_total_exposure_pct: 0.80 # all strategy crypto <= 80% of equity
  max_order_notional_pct: 0.30 # one order cannot exceed 30% of equity
  min_order_notional: 5.00     # suppress tiny churn; exits are always allowed
  stop_loss_pct: 0.08          # close a coin at an 8% unrealized loss
  max_daily_loss_pct: 0.04     # flatten and pause after a 4% UTC-day loss
  max_data_age_sec: 180        # stale prices block new exposure
  stop_cooldown_min: 360       # no re-entry for six hours after a stop

backtest:
  slippage_bps: 10
  fee_bps: 15
  initial_equity: 100000
